name: Build & Deploy (Vite → Cloudflare Pages)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install pnpm (uses package.json "packageManager" if present)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # or omit to use package.json's "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'   # enable pnpm cache

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (Vite)
        env:
          CI: true
        run: pnpm build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: ${{ secrets.CF_PAGES_PROJECT }}
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
